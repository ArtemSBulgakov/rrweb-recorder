<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>Replay</title></head>
<body><main><div class="toolbar"><button id="back" class="secondary">← Recordings</button><button id="import-recording" class="secondary">Open rrweb JSON / ZIP</button><input id="recording-file" type="file" accept=".json,.zip,.rrweb.json,.rrweb.zip,application/json,application/zip" hidden></div><h1 id="title">Replay</h1>
<div class="replay-meta"><span id="recorded-at"></span><strong id="playback-datetime"></strong></div>
<nav id="tabs" class="replay-tabs" aria-label="Recorded tabs"></nav>
<div id="player" class="card"></div>
<div class="replay-panels">
  <section class="card"><h2>Console <span id="console-count" class="count"></span></h2><div id="console-events" class="event-list"></div></section>
  <section class="card"><div class="panel-heading"><h2>Network <span id="network-count" class="count"></span></h2><button id="export-pcap" class="secondary">Export PCAP</button></div><div id="network-events" class="event-list"></div></section>
</div>
</main><script type="module" src="./index.ts"></script></body></html>
